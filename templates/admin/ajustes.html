{% extends "admin/base.html" %}
{% block title %}Ajustes — Speech R' Us{% endblock %}

{% block content %}
<h1>Datos que salen en la página</h1>
<p class="lead">Cambia teléfono, horarios o direcciones sin tocar código.</p>
<form class="settings" method="post">
  <input type="hidden" name="csrf" value="{{ csrf_token }}">
  <label>Nombre corto
    <input name="clinic_name" value="{{ clinic.clinic_name }}">
  </label>
  <label>Nombre legal
    <input name="legal_name" value="{{ clinic.legal_name }}">
  </label>
  <label>Frase bajo el logo
    <input name="tagline" value="{{ clinic.tagline }}">
  </label>
  <label>Teléfono (cómo se ve)
    <input name="phone" value="{{ clinic.phone }}">
  </label>
  <label>Teléfono solo números (para WhatsApp)
    <input name="phone_digits" value="{{ clinic.phone_digits }}">
  </label>
  <label>Correo
    <input name="email" type="email" value="{{ clinic.email }}">
  </label>
  <label>Facebook
    <input name="facebook" value="{{ clinic.facebook }}">
  </label>
  <label>Instagram
    <input name="instagram" value="{{ clinic.instagram }}">
  </label>
  <label>Horario general
    <input name="hours" value="{{ clinic.hours }}">
  </label>
  <label>Horario Hormigueros
    <input name="hormigueros_hours" value="{{ clinic.h_hours }}">
  </label>
  <label>Horario Añasco
    <input name="anasco_hours" value="{{ clinic.a_hours }}">
  </label>
  <label>Bienvenida (inglés)
    <textarea name="welcome_en" rows="3">{{ clinic.welcome_en }}</textarea>
  </label>
  <label>Correo para avisos de citas
    <input name="notify_email" type="email" value="{{ clinic.notify_email }}">
  </label>
  <label>SMTP host (opcional)
    <input name="smtp_host" value="{{ clinic.smtp_host }}">
  </label>
  <label>SMTP usuario
    <input name="smtp_user" value="{{ clinic.smtp_user }}">
  </label>
  <label>SMTP contraseña
    <input name="smtp_pass" type="password" value="{{ clinic.smtp_pass }}">
  </label>
  <label>SMTP puerto
    <input name="smtp_port" value="{{ clinic.smtp_port or '587' }}">
  </label>
  <label>Dirección Hormigueros
    <input name="hormigueros_address" value="{{ clinic.hormigueros_address }}">
  </label>
  <label>Mapa de Hormigueros (enlace de Google)
    <input name="hormigueros_maps" value="{{ clinic.hormigueros_maps }}">
  </label>
  <label>Dirección Añasco
    <input name="anasco_address" value="{{ clinic.anasco_address }}">
  </label>
  <label>Mapa de Añasco (enlace de Google)
    <input name="anasco_maps" value="{{ clinic.anasco_maps }}">
  </label>
  <label>Teléfono Añasco
    <input name="anasco_phone" value="{{ clinic.anasco_phone }}">
  </label>
  <label>Texto de bienvenida (inicio)
    <textarea name="welcome" rows="4">{{ clinic.welcome }}</textarea>
  </label>
  <label>Cambiar contraseña del panel (déjalo vacío si no)
    <input name="new_password" type="password" minlength="8" autocomplete="new-password">
  </label>
  <button class="btn" type="submit">Guardar cambios</button>
</form>
{% endblock %}
