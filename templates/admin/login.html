<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar al panel — Speech R' Us</title>
  <link rel="icon" href="{{ url_for('static', filename='img/favicon.png') }}">
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Baloo+2:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body class="login-body">
  <form class="login-card" method="post">
    <img src="{{ url_for('static', filename='img/logo-transparent.png') }}" alt="Speech R' Us" width="240" height="96">
    <h1>Panel de la clínica</h1>
    <p>Para publicar artículos y ver las citas que llegan por la página.</p>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}<p class="flash {{ cat }}">{{ msg }}</p>{% endfor %}
    {% endwith %}
    <input type="hidden" name="csrf" value="{{ csrf_token }}">
    <label>Usuario
      <input name="username" value="admin" autocomplete="username" required>
    </label>
    <label>Contraseña
      <input name="password" type="password" autocomplete="current-password" required>
    </label>
    <button class="btn" type="submit">Entrar</button>
  </form>
</body>
</html>
